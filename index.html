<style>
:root{--bg:#f7f3ec;--card:#fff;--ink:#1f2328;--muted:#5e6670;--line:#e3ddd2;--accent:#2f5d8a;--accent-soft:#e6eef6;--go:#2e7d4f;--go-dark:#256a42;--danger:#b3261e;--radius:14px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.top{position:sticky;top:0;z-index:20;background:var(--accent);color:#fff;padding:calc(6px + env(safe-area-inset-top)) 8px 6px;display:flex;align-items:center;gap:6px;min-height:60px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.top h1{flex:1;margin:0 4px;font-size:19px;line-height:1.2;font-weight:650;overflow:hidden;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tbtn{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;min-height:48px;min-width:48px;padding:2px 10px;font-size:16px;line-height:1.15;font-weight:600;display:inline-flex;align-items:center;gap:4px;max-width:40%;overflow:hidden;text-align:left;flex:none}
.tbtn .bl{overflow:hidden;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tbtn:active{background:rgba(255,255,255,.3)}
.saved{font-size:13px;opacity:.85;min-width:44px;text-align:right}
main{max-width:720px;margin:0 auto;padding:14px 14px 40px}
.lead{color:var(--muted);margin:2px 2px 14px;font-size:17px}
.list{display:flex;flex-direction:column;gap:10px;margin:0 0 16px;padding:0;list-style:none}
.row{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);display:flex;align-items:stretch;min-height:64px;overflow:hidden}
.row .open{flex:1;background:none;border:0;text-align:left;padding:12px 14px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.row .open:active{background:var(--accent-soft)}
.row .name{font-weight:650;font-size:19px;overflow-wrap:anywhere}
.row .meta{color:var(--muted);font-size:15px}
.row .chev{align-self:center;padding-right:14px;color:var(--muted);font-size:24px}
.ctrls{display:flex;align-items:center;gap:4px;padding:6px;border-left:1px solid var(--line);background:#fbfaf7;flex-wrap:wrap;justify-content:flex-end;max-width:56%}
.row.arr{flex-wrap:wrap}.row.arr .ctrls{flex-basis:100%;max-width:none;border-left:0;border-top:1px solid var(--line);gap:8px;justify-content:flex-end}.row.arr .ctrls .ibtn{min-width:56px}
.ibtn{min-width:48px;min-height:48px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:20px;display:inline-flex;align-items:center;justify-content:center;padding:0 8px}
.ibtn:active{background:var(--accent-soft)}
.ibtn:disabled{opacity:.3}
.ibtn.del{color:var(--danger)}
.badge{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;background:#fff3cd;color:#7a5b00;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.big{display:flex;width:100%;align-items:center;justify-content:center;gap:8px;min-height:60px;border:0;border-radius:var(--radius);background:var(--go);color:#fff;font-size:20px;font-weight:700;margin:8px 0;box-shadow:0 2px 0 var(--go-dark)}
.big:active{transform:translateY(1px);box-shadow:none}
.big.blue{background:var(--accent);box-shadow:0 2px 0 #234a70}
.big.light{background:#fff;color:var(--accent);border:2px solid var(--accent);box-shadow:none}
.plain{display:flex;width:100%;align-items:center;justify-content:center;min-height:52px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;font-size:17px;font-weight:600;margin:8px 0;color:var(--accent)}
.plain.on{background:var(--accent-soft);border-color:var(--accent)}
.danger{color:var(--danger)}
.empty{background:var(--card);border:2px dashed var(--line);border-radius:var(--radius);padding:22px 16px;text-align:center;color:var(--muted);margin-bottom:12px}
.tract h2.ttl{font-size:26px;line-height:1.25;margin:4px 2px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px 10px;margin:0 0 12px}
.card .sub-title{font-size:21px;margin:4px 0 6px;color:var(--accent)}
.card .cardbar{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:10px;padding-top:8px}
.card .editbtn{min-height:48px;padding:0 16px;border-radius:10px;border:1px solid var(--accent);background:#fff;color:var(--accent);font-weight:650}
.rich{overflow-wrap:anywhere}
.rich h2{font-size:22px;margin:14px 0 6px;line-height:1.3}
.rich h3{font-size:19px;margin:12px 0 4px}
.rich h4{font-size:18px;margin:10px 0 4px}
.rich p{margin:0 0 10px}
.rich ul,.rich ol{margin:0 0 10px;padding-left:28px}
.rich li{margin:3px 0}
.rich blockquote{margin:8px 0 12px;padding:8px 12px;border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0}
.rich img{max-width:100%;height:auto;border-radius:8px;display:block;margin:8px 0}
.rich figure{margin:12px auto;padding:0;max-width:100%}
.rich figure.size-s{width:45%}.rich figure.size-m{width:72%}.rich figure.size-l{width:100%}
.rich figure img{width:100%;margin:0}
.rich figcaption{font-size:15px;line-height:1.35;color:var(--muted);text-align:center;font-style:italic;margin-top:5px}
.editor figure{cursor:pointer;border-radius:10px;outline:2px dashed #b9c9da;outline-offset:3px}
.sheet .pv{max-width:100%;max-height:150px;display:block;margin:0 auto 6px;border-radius:8px}
.seg{display:flex;gap:6px}.seg button{flex:1;min-height:52px;border-radius:12px;border:1px solid #cfc7b8;background:#fff;font-weight:650;font-size:16px;padding:0 4px}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.sheet .btns .warn{color:var(--danger)}
.searchbar{display:flex;align-items:center;gap:10px;width:100%;min-height:54px;margin:0 0 14px;padding:0 14px;border:1px solid #cfc7b8;border-radius:var(--radius);background:#fff;color:var(--muted);font-size:18px;text-align:left}
.res{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin:0 0 10px;min-height:60px}
.res:active{background:var(--accent-soft)}
.res .kind{display:inline-block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 6px;margin-right:6px;vertical-align:2px}
.res .rt{font-weight:650;font-size:18px;overflow-wrap:anywhere}
.res .rp{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.res .rs{display:block;font-size:16px;margin-top:4px;overflow-wrap:anywhere}
mark{background:#ffe58a;color:inherit;border-radius:3px;padding:0 1px}
.card.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%,40%{box-shadow:0 0 0 4px #f2c94c}100%{box-shadow:0 0 0 0 transparent}}
.handle{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;min-width:56px;min-height:48px;border-radius:10px;border:1px dashed #9fb3c8;background:#f4f8fb;color:var(--accent);font-size:16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:0 10px;margin-right:auto}
.dragging{position:relative;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:.97}
.shifting{transition:transform .15s ease}
body.is-dragging{user-select:none;-webkit-user-select:none}
.rich a{color:var(--accent);text-decoration:underline;word-break:break-word}
.rich .empty-note{color:var(--muted);font-style:italic}
label.fl{display:block;font-weight:650;margin:6px 2px 4px;font-size:16px;color:var(--muted)}
input.text{width:100%;min-height:52px;border:1px solid #cfc7b8;border-radius:12px;padding:10px 12px;background:#fff;font-size:18px}
input.text:focus{outline:3px solid #9cc0e4;border-color:var(--accent)}
:root{--hdr:60px;--tbh:0px}
html{scroll-padding-top:calc(var(--hdr) + var(--tbh) + 10px);scroll-padding-bottom:16px}
.toolbar{position:sticky;top:var(--hdr);z-index:15;display:flex;flex-wrap:wrap;gap:6px;background:var(--bg);padding:8px 0}
.toolbar button{flex:1 1 auto;white-space:nowrap;min-width:48px;min-height:46px;padding:0 7px;border-radius:10px;border:1px solid #cfc7b8;background:#fff;font-size:15px;font-weight:600}
@media(max-width:380px){.toolbar{gap:4px}.toolbar button{padding:0 4px;font-size:14px;min-width:44px}}
.toolbar button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.toolbar button:active{background:var(--accent-soft)}
.editor{min-height:220px;scroll-margin-top:calc(var(--hdr) + var(--tbh) + 10px);background:#fff;border:1px solid #cfc7b8;border-radius:12px;padding:12px 14px;outline:none}
.editor:focus{border-color:var(--accent);box-shadow:0 0 0 3px #9cc0e4}
.editor:empty:before{content:attr(data-placeholder);color:#8a8f96}
.hint{font-size:15px;color:var(--muted);margin:6px 2px}
.plain.backup{border:2px solid var(--accent);font-size:18px}
.remind{background:#fff8e1;border:1px solid #e6c766;border-radius:var(--radius);padding:8px 10px;margin:0 0 10px;color:#4d3b00;font-size:16px;line-height:1.35}
.remind p{margin:0 0 6px}
@media(max-width:380px){.remind{font-size:15px;padding:6px 8px}.remind button{min-height:44px}.plain.backup{min-height:46px;margin:6px 0}}
.remind .two{display:flex;gap:8px}
.remind button{flex:1;min-height:48px;border-radius:10px;border:1px solid #d9b94f;background:#fff;font-weight:650;color:#4d3b00}
.remind button.go{background:var(--go);color:#fff;border-color:var(--go)}
.safe-ok{background:#e8f5ec;border-radius:10px;padding:8px 10px}
.safe-warn{background:#fff3cd;border-radius:10px;padding:8px 10px;color:#4d3b00}
.doc{background:#fff;color:#1f2328;border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.doc h1{font-size:28px;margin:0 0 2px;line-height:1.2}
.doc .pdate{color:var(--muted);margin:0 0 14px}
.doc .toc h2{font-size:20px;margin:10px 0 4px}
.doc .toc ol{margin:0 0 6px;padding-left:24px}
.doc .psec>h2{font-size:24px;border-bottom:2px solid var(--accent);padding-bottom:4px;margin:26px 0 8px;line-height:1.25}
.doc .ptopic>h3{font-size:21px;margin:18px 0 6px;line-height:1.25}
.doc .ptitle{font-size:18px;margin:12px 0 4px;color:var(--accent)}
.doc .rich h2{font-size:19px}.doc .rich h3{font-size:18px}.doc .rich h4{font-size:17px}
.doc .url{color:var(--muted);font-size:.85em;word-break:break-all}
.doc .pfoot{color:var(--muted);font-size:14px;margin-top:24px}
@media print{
  @page{margin:16mm 14mm}
  html,body{background:#fff !important}
  body{font-size:12pt;padding:0}
  header.top,.noprint,#toast,#banner,#modal{display:none !important}
  main,main.printmain{max-width:none;padding:0;margin:0}
  .doc{border:0;padding:0;border-radius:0}
  .doc .psec{break-before:page}
  .doc h1,.doc h2,.doc h3,.doc h4{break-after:avoid}
  .doc figure,.doc img,.doc blockquote,.doc li{break-inside:avoid}
  .doc p{orphans:3;widows:3}
  .doc .rich a{color:#1f2328}
  .doc .rich blockquote{background:#f1f4f8}
}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin:0 0 16px}
.panel h2{margin:0 0 6px;font-size:21px}
.panel p{margin:4px 0 10px}
.pick{list-style:none;margin:6px 0 8px;padding:0}
.pick li{margin:0}
.pick label{display:flex;align-items:center;gap:12px;min-height:56px;padding:4px 4px;border-bottom:1px solid #f0ebe2}
.pick .tp label{padding-left:36px;font-size:17px}
.pick input{width:32px;height:32px;flex:none;accent-color:var(--accent)}
.pick .sname{font-weight:650}
.two{display:flex;gap:8px}
.two>*{flex:1}
.help h2{font-size:21px;margin:18px 0 6px}
.help ol,.help ul{padding-left:24px}
.help li{margin:6px 0}
#modal{position:fixed;inset:0;background:rgba(20,25,30,.5);display:none;align-items:flex-end;justify-content:center;z-index:100;padding:10px;overflow:hidden}
#modal.show{display:flex}
.sheet{background:#fff;border-radius:18px;width:100%;max-width:520px;padding:18px 16px calc(14px + env(safe-area-inset-bottom));box-shadow:0 10px 40px rgba(0,0,0,.3);max-height:100%;overflow:auto;overscroll-behavior:contain;margin:0}
.sheet h2{margin:0 0 8px;font-size:21px}
.sheet .msg{margin:0 0 12px;white-space:pre-line}
.sheet .alert{margin:0 0 12px;padding:10px 12px;border-left:5px solid #b3261e;background:#fdecea;color:#8c1d18;font-weight:700}
.sheet .btns{display:flex;gap:8px;margin-top:14px;position:sticky;bottom:calc(-14px - env(safe-area-inset-bottom));background:#fff;padding:8px 0 4px}
.sheet input.text{scroll-margin-top:12px;scroll-margin-bottom:96px}
.sheet .draftnote{background:#fff3cd;border-radius:8px;padding:6px 10px;color:#4d3b00}
.sheet .btns button{flex:1;min-height:54px;border-radius:12px;font-size:18px;font-weight:700;border:1px solid var(--line);background:#fff}
.sheet .btns .ok{background:var(--accent);color:#fff;border-color:var(--accent)}
.sheet .btns .ok.red{background:var(--danger);border-color:var(--danger)}
@media(min-width:700px){#modal{align-items:center}}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:12px 18px;border-radius:12px;font-size:16px;max-width:92vw;z-index:120;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.sr{position:absolute;left:-9999px}
#banner{position:relative;background:#fff3cd;color:#4d3b00;border-bottom:1px solid #e6cf7a;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:none;font-size:16px}
#banner.show{display:block}
#updnote{position:fixed;top:var(--hdr);left:0;right:0;z-index:40;display:flex;align-items:center;gap:6px;min-height:52px;background:#e8f5ec;border-bottom:1px solid #b9d3b2;box-shadow:0 2px 6px rgba(0,0,0,.12);padding:4px 8px}
#updgo{flex:1;min-height:48px;border:0;background:none;color:#1e4d2b;font-size:17px;font-weight:700;text-align:left;padding:0 6px}
#updlater{flex:none;min-height:44px;min-width:64px;border:1px solid #9cc3a2;border-radius:10px;background:#fff;color:#1e4d2b;font-weight:650}
#updnote[hidden]{display:none}
.ver{color:var(--muted);font-size:13px;margin:-8px 2px 12px}
#banner button{display:block;margin:6px 0 0 auto;min-height:48px;min-width:96px;border-radius:10px;border:1px solid #c9a93a;background:#fff;font-weight:700}
.addr{overflow-wrap:anywhere;font-weight:650}
.bk{margin:0 0 12px}
.bkbtn{display:flex;flex-direction:column;width:100%;align-items:center;justify-content:center;min-height:60px;border:0;border-radius:var(--radius);background:var(--accent);color:#fff;font-size:20px;font-weight:700;margin:0;padding:8px 12px;box-shadow:0 2px 0 #234a70;line-height:1.25}
.bkbtn:active{transform:translateY(1px);box-shadow:none}
.bkbtn .bksub{font-size:15px;font-weight:650}
.bkbtn.changed{background:#f6c344;color:#3d2e00;box-shadow:0 2px 0 #c99a1e;border:2px solid #c99a1e}
.bkinfo{font-size:15px;color:var(--muted);margin:6px 2px 0;overflow-wrap:anywhere}
.bkinfo b{color:var(--ink)}
.restore h2{margin-top:0}
.restore .sch{font-size:19px;margin:16px 0 4px}
.safety{list-style:none;margin:8px 0 0;padding:0}
.safety li{border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:0 0 10px;background:#fff}
.safety li p{margin:0 0 6px}
.safety button{min-height:48px;margin:4px 0}
.safety .redtext{color:var(--danger)}
.sheet .choices{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.sheet .choices button{min-height:56px;border-radius:12px;font-size:18px;font-weight:700;border:1px solid var(--line);background:#fff;padding:6px 10px;color:var(--accent)}
.sheet .choices button.go{background:var(--go);color:#fff;border-color:var(--go)}
.sheet .choices button.redline{color:var(--danger);border:2px solid var(--danger);font-size:16px;min-height:50px}
.sheet .choices .why{display:block;font-size:14px;font-weight:600;opacity:.9}
</style>

<body>
<div id="banner" role="status" aria-live="polite"></div>
<div id="updnote" role="status" hidden><button type="button" id="updgo">✨ New version ready — tap to update</button><button type="button" id="updlater">Later</button></div>
<div id="app"><header class="top"><h1>My Witnessing Notes</h1></header><main id="main"><p class="lead">Loading…</p></main></div>
<div id="modal" role="dialog" aria-modal="true"></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="pickImage" class="sr" accept="image/*" aria-hidden="true" tabindex="-1">

<noscript><p style="padding:20px">This app needs JavaScript turned on in your browser.</p></noscript>
<script>
(function(){
"use strict";
/* Copy of the untouched page, captured before anything is drawn. Used for "give someone the app". */
var PRISTINE = document.documentElement.cloneNode(true);
var APP_VERSION = "0.11 (proof of concept)";
/* When the app is opened from a web address (not a saved file), let it be installed and work offline. */
var HOSTED = /^https?:$/.test(location.protocol);
if (HOSTED){
  var ml = document.createElement("link"); ml.rel = "manifest"; ml.href = "manifest.webmanifest"; document.head.appendChild(ml);
  if ("serviceWorker" in navigator) window.addEventListener("load", setupUpdates);
}
/* After Chrome installs it: on some Android phones (Samsung) the icon goes only to the app drawer. */
var INSTALL_TIP = "If you don’t see the icon on your home screen, look in your app drawer. To put it on your home screen, long-press the icon and pick Add to Home.";
/* Shown once only (not on every install event). */
window.addEventListener("appinstalled", function(){ setTimeout(function(){ if (typeof info !== "function" || !loaded || meta.installTipShown) return; meta.installTipShown = now(); saveMeta(); info("The app is installed", INSTALL_TIP); }, 0); });
/* Updates: look for a new version when the app opens and whenever it comes back to the screen.
   A new version is never switched in by itself: a note offers it, and tapping the note saves any open text first,
   then switches to the new version and reloads once. */
var swReg = null, waitingWorker = null, updateTapped = false, updateReloaded = false, updateLater = false;
function setupUpdates(){
  navigator.serviceWorker.register("sw.js").then(function(reg){
    swReg = reg;
    if (reg.waiting && navigator.serviceWorker.controller) offerUpdate(reg.waiting);
    reg.addEventListener("updatefound", function(){
      var w = reg.installing; if (!w) return;
      w.addEventListener("statechange", function(){ if (w.state === "installed" && navigator.serviceWorker.controller) offerUpdate(w); });
    });
  }).catch(function(e){ console.warn("offline helper not started", e); });
  navigator.serviceWorker.addEventListener("controllerchange", function(){
    if (!updateTapped || updateReloaded) return;   /* only after a tap, and only once */
    updateReloaded = true; location.reload();
  });
  document.addEventListener("visibilitychange", function(){ if (document.visibilityState === "visible") checkForUpdate(); });
}
function checkForUpdate(){ if (swReg) { try { swReg.update().catch(function(){}); } catch(e){} } }
/* Compare versions number by number, so 0.10 is newer than 0.9. */
function cmpVer(a, b){ a = String(a || "").split(" ")[0].split(/[.-]/); b = String(b || "").split(" ")[0].split(/[.-]/);
  for (var i = 0; i < Math.max(a.length, b.length); i++){ var x = parseInt(a[i], 10), y = parseInt(b[i], 10); x = isNaN(x) ? -1 : x; y = isNaN(y) ? -1 : y; if (x !== y) return x < y ? -1 : 1; }
  return 0; }
function offerUpdate(w){ waitingWorker = w; updateLater = false; refreshUpdateNote(); }
/* The note covers the title bar (so nothing on the page moves), and waits while a part is being edited. */
function refreshUpdateNote(){
  var b = document.getElementById("updnote"); if (!b) return;
  var editing = (location.hash || "").indexOf("#/e/") === 0;
  b.hidden = !(waitingWorker && (updateTapped || (!updateLater && !editing)));
  var go = document.getElementById("updgo"), later = document.getElementById("updlater");
  if (go) go.onclick = applyUpdate;
  if (later){ later.hidden = updateTapped; later.onclick = function(){ updateLater = true; refreshUpdateNote(); toast("OK. The new version will be used next time you open the app."); }; }
}
function applyUpdate(){
  if (!waitingWorker || updateTapped) return;
  updateTapped = true; var b = document.getElementById("updgo"); if (b) b.textContent = "Updating…"; refreshUpdateNote();
  var w = waitingWorker, p;
  try { flushEditor(); p = saveNow(); } catch(e){ p = null; }
  Promise.resolve(p).catch(function(){}).then(function(){
    w.postMessage({ type:"skipWaiting" });
    setTimeout(function(){ if (!updateReloaded){ updateReloaded = true; location.reload(); } }, 4000);  /* in case the switch isn't reported */
  });
}
var FORMAT = "witnessing-app";

/* ---------- small helpers ---------- */
function $(s, r){ return (r||document).querySelector(s); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function uid(){ var a = new Uint8Array(12); (window.crypto||window.msCrypto).getRandomValues(a); var s = ""; for (var i=0;i<a.length;i++) s += ("0"+a[i].toString(16)).slice(-2); return "w" + s; }
function now(){ return new Date().toISOString(); }
function norm(s){ return String(s||"").trim().toLowerCase().replace(/\s+/g," "); }
function cleanTitle(s){ return String(s==null?"":s).replace(/[\u0000-\u001f]/g," ").trim().slice(0,200); }
function okId(id){ return typeof id === "string" && /^[A-Za-z0-9_-]{1,64}$/.test(id); }
function plural(n, one, many){ return n + " " + (n===1?one:many); }
function today(){ var d=new Date(); return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }
function slug(s){ return norm(s).replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40) || "notes"; }
function fmtSize(n){ if (n < 1024) return n + (n === 1 ? " byte" : " bytes"); return n < 1024*1024 ? Math.max(1,Math.round(n/1024)) + " KB" : (n/1024/1024).toFixed(1) + " MB"; }

/* ---------- cleaning text that comes from pasting or from other people's files ---------- */
var ALLOWED = {P:1,BR:1,H2:1,H3:1,H4:1,STRONG:1,B:1,EM:1,I:1,U:1,UL:1,OL:1,LI:1,BLOCKQUOTE:1,A:1,IMG:1,HR:1};
var DROP = {SCRIPT:1,STYLE:1,IFRAME:1,FRAME:1,FRAMESET:1,OBJECT:1,EMBED:1,SVG:1,MATH:1,TEMPLATE:1,NOSCRIPT:1,LINK:1,META:1,TITLE:1,HEAD:1,FORM:1,INPUT:1,BUTTON:1,TEXTAREA:1,SELECT:1,OPTION:1,VIDEO:1,AUDIO:1,CANVAS:1,SOURCE:1,TRACK:1,BASE:1,APPLET:1,PORTAL:1,DIALOG:1};
var RENAME = {H1:"H2",H5:"H4",H6:"H4"};
var BLOCKS = {FIGURE:1,IMG:1,P:1,DIV:1,H1:1,H2:1,H3:1,H4:1,H5:1,H6:1,UL:1,OL:1,LI:1,BLOCKQUOTE:1,TABLE:1,SECTION:1,ARTICLE:1,HEADER:1,FOOTER:1,PRE:1,HR:1};
function safeHref(h){
  h = String(h||"").trim();
  if (!/^(https?:|mailto:|tel:)/i.test(h) || /\s/.test(h)) return null;
  if (/^https?:/i.test(h)){ if (!/^https?:\/\/[^\/\\?#@\s]/i.test(h)) return null; try { if (!new URL(h).hostname) return null; } catch(e){ return null; } }
  return h;
}
/* Pictures must be stored inside the notes (data: pictures). Pictures from the internet are left out, so opening a
   note never contacts another website. Very large pictures (over about 2 MB) are left out too. */
var MAX_PIC = 2800000, dropped = { big:0, web:0 };
function safeSrc(s){
  s = String(s||"").trim();
  if (/^data:image\/(png|jpe?g|gif|webp);base64,[A-Za-z0-9+\/=\s]+$/i.test(s)){ s = s.replace(/\s+/g,""); if (s.length > MAX_PIC){ dropped.big++; return null; } return s; }
  if (s) dropped.web++;
  return null;
}
var BLOCK_SEL = "figure,img,p,div,h1,h2,h3,h4,h5,h6,ul,ol,li,blockquote,table,section,article,header,footer,pre,hr";
function sanitize(html){
  var doc = new DOMParser().parseFromString("<!DOCTYPE html><html><body>" + String(html||"") + "</body></html>", "text/html");
  var out = doc.createElement("div");
  function walk(src, dst){
    for (var n = src.firstChild; n; n = n.nextSibling){
      if (n.nodeType === 3){ dst.appendChild(doc.createTextNode(n.nodeValue)); continue; }
      if (n.nodeType !== 1) continue;
      var tag = n.tagName.toUpperCase();
      if (DROP[tag]) continue;
      if (RENAME[tag]) tag = RENAME[tag];
      if (tag === "DIV" || tag === "PRE" || tag === "SECTION" || tag === "ARTICLE"){
        var hasBlock = !!n.querySelector(BLOCK_SEL);
        if (!hasBlock && dst.tagName !== "LI" && dst.tagName !== "P" && dst.tagName !== "BLOCKQUOTE"){ var p = doc.createElement("p"); walk(n, p); if (p.childNodes.length) dst.appendChild(p); }
        else walk(n, dst);
        continue;
      }
      if (tag === "FIGURE" || tag === "IMG"){
        var im0 = tag === "IMG" ? n : n.querySelector("img"); if (!im0) continue;
        var src0 = safeSrc(im0.getAttribute("src")); if (!src0) continue;
        var fig = doc.createElement("figure"), sz = tag === "FIGURE" && /(?:^|\s)size-(s|m|l)(?:\s|$)/.exec(n.getAttribute("class") || "");
        fig.setAttribute("class", "pic size-" + (sz ? sz[1] : "l"));
        var im = doc.createElement("img"); im.setAttribute("src", src0); var alt0 = im0.getAttribute("alt"); im.setAttribute("alt", alt0 ? alt0.slice(0,300) : "");
        fig.appendChild(im);
        var fc = tag === "FIGURE" && n.querySelector("figcaption"), cap = "";
        if (fc){ fc = fc.cloneNode(true); fc.querySelectorAll("script,style,template,noscript,svg,math,iframe,object,embed").forEach(function(x){ x.remove(); }); cap = cleanTitle(fc.textContent).slice(0,300); }
        if (cap){ var fc2 = doc.createElement("figcaption"); fc2.textContent = cap; fig.appendChild(fc2); }
        dst.appendChild(fig); continue;
      }
      if (!ALLOWED[tag]){ walk(n, dst); continue; }
      if (tag === "P" || tag === "H2" || tag === "H3" || tag === "H4" || tag === "A"){
        if (n.querySelector(tag === "A" ? "img,figure" : BLOCK_SEL)){ walk(n, dst); continue; }
      }
      var el = doc.createElement(tag.toLowerCase());
      if (tag === "A"){
        var h = safeHref(n.getAttribute("href"));
        if (!h){ walk(n, dst); continue; }
        el.setAttribute("href", h); el.setAttribute("target","_blank"); el.setAttribute("rel","noopener noreferrer");
      }
      if (tag !== "BR" && tag !== "HR") walk(n, el);
      if (tag === "P" && !el.firstChild) continue;
      dst.appendChild(el);
    }
  }
  walk(doc.body, out);
  var res = out.innerHTML;
  if (/^(\s|<br>|<p>(\s|<br>)*<\/p>)*$/.test(res)) return "";
  return res;
}

/* ---------- storage on this device (IndexedDB, with a simpler fallback) ---------- */
/* Each copy made with Share has its own storage space ("copy id"), so it doesn't mix notes with yours.
   The original file uses the space "main". The same file opened twice shares one space (see saveNow: changes are combined).
   Version 0.1 kept notes in one shared space ("witnessing-app"); the main copy moves them over once. */
var LEGACY_DB = "witnessing-app";
var store = (function(){
  var db = null, mode = "none", prefix = "";
  function openIDB(name){ return new Promise(function(res, rej){
    try {
      if (!window.indexedDB) return rej(new Error("no idb"));
      var r = indexedDB.open(name, 1);
      r.onupgradeneeded = function(){ r.result.createObjectStore("kv"); };
      r.onsuccess = function(){ res(r.result); };
      r.onerror = function(){ rej(r.error); };
      r.onblocked = function(){ rej(new Error("blocked")); };
      setTimeout(function(){ rej(new Error("timeout")); }, 4000);
    } catch(e){ rej(e); }
  }); }
  function idbGet(d, key){ return new Promise(function(res, rej){ var t = d.transaction("kv","readonly").objectStore("kv").get(key); t.onsuccess = function(){ res(t.result); }; t.onerror = function(){ rej(t.error); }; }); }
  function idbSet(d, key, val){ return new Promise(function(res, rej){ var tx = d.transaction("kv","readwrite"); tx.objectStore("kv").put(val, key); tx.oncomplete = function(){ res(); }; tx.onerror = function(){ rej(tx.error); }; tx.onabort = function(){ rej(tx.error || new Error("aborted")); }; }); }
  function lsGet(k){ try { var v = localStorage.getItem(k); return Promise.resolve(v ? JSON.parse(v) : undefined); } catch(e){ return Promise.reject(e); } }
  function lsSet(k, val){ try { localStorage.setItem(k, JSON.stringify(val)); return Promise.resolve(); } catch(e){ return Promise.reject(e); } }
  function legacyExists(){ try { if (indexedDB.databases) return indexedDB.databases().then(function(list){ return list.some(function(x){ return x.name === LEGACY_DB; }); }, function(){ return true; }); } catch(e){} return Promise.resolve(true); }
  function withLegacy(fn){ return legacyExists().then(function(yes){ if (!yes) return undefined; return openIDB(LEGACY_DB).then(function(d){ return fn(d).then(function(v){ d.close(); return v; }, function(e){ d.close(); throw e; }); }); }); }
  return {
    init: function(ns){ prefix = "wa-" + ns + "-"; return openIDB("wa-notes-" + ns).then(function(d){ db = d; mode = "idb"; }, function(){ try { localStorage.setItem("wa-test","1"); localStorage.removeItem("wa-test"); mode = "ls"; } catch(e){ mode = "memory"; } }); },
    mode: function(){ return mode; },
    get: function(key){ if (mode === "idb") return idbGet(db, key); if (mode === "ls") return lsGet(prefix + key); return Promise.resolve(undefined); },
    set: function(key, val){ if (mode === "idb") return idbSet(db, key, val); if (mode === "ls") return lsSet(prefix + key, val); return Promise.resolve(); },
    /* Read what is stored, work out the new value, and write it, all in one step (no other window can save in between). */
    update: function(key, fn){
      if (mode === "idb") return new Promise(function(res, rej){
        var tx = db.transaction("kv","readwrite"), os = tx.objectStore("kv"), out, g = os.get(key);
        g.onsuccess = function(){ try { out = fn(g.result); os.put(out, key); } catch(e){ try { tx.abort(); } catch(e2){} rej(e); } };
        tx.oncomplete = function(){ res(out); }; tx.onerror = function(){ rej(tx.error); }; tx.onabort = function(){ rej(tx.error || new Error("aborted")); };
      });
      if (mode === "ls") return lsGet(prefix + key).then(function(v){ var out = fn(v); return lsSet(prefix + key, out).then(function(){ return out; }); });
      return Promise.resolve(fn(undefined));
    },
    legacyGet: function(key){ if (mode === "idb") return withLegacy(function(d){ return idbGet(d, key); }); if (mode === "ls") return lsGet("wa-" + key); return Promise.resolve(undefined); },
    legacySet: function(key, val){ if (mode === "idb") return withLegacy(function(d){ return idbSet(d, key, val); }); if (mode === "ls") return lsSet("wa-" + key, val); return Promise.resolve(); }
  };
})();

var data = { sections: [] };
var meta = { initialized: false, appliedBundles: [] };
var saveTimer = null, savePending = false, saving = null, loaded = false;
/* rev counts saves. baseJSON is what this window last read from (or wrote to) storage. If another tab or window
   saved in the meantime, the two sets of changes are combined (merge3) instead of one replacing the other. */
var rev = 0, baseJSON = JSON.stringify({sections:[]}), TAB = uid();
function snap(){ return JSON.stringify({sections:data.sections}); }
function saveSoon(delay){ savePending = true; setSaved("Saving…"); clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, delay == null ? 250 : delay); }
function saveNow(){
  flushEditor();
  clearTimeout(saveTimer);
  if (saving) return saving.then(saveNow);
  if (!savePending || !loaded) return Promise.resolve();
  savePending = false;
  var mineJSON = snap(), mine = JSON.parse(mineJSON), started = Date.now(), combined = false, report = {};
  saving = store.update("data", function(stored){
    var theirRev = stored && typeof stored.rev === "number" ? stored.rev : 0, out = mine;
    if (stored && Array.isArray(stored.sections) && theirRev !== rev){ report = {}; out = merge3(JSON.parse(baseJSON), mine, {sections:stored.sections}, report); combined = true; }
    return { sections: out.sections, rev: Math.max(theirRev, rev) + 1 };
  }).then(function(saved){
    saving = null; rev = saved.rev;
    var savedJSON = JSON.stringify({sections:saved.sections}); baseJSON = savedJSON;
    if (combined && savedJSON !== mineJSON){
      /* Another window had saved changes. Keep anything typed here while saving, on top of the combined notes. */
      data.sections = merge3(mine, JSON.parse(snap()), {sections:saved.sections}).sections;
      if (snap() !== savedJSON) savePending = true;
      refreshView(); toast("Changes made in another tab or window were added in.");
    }
    keptMessage(report);
    clearPending(started);
    if (savePending) saveSoon(); else setSaved("Saved");
    tellOthers({t:"saved", rev:rev});
    if (storageInfo.persisted === false && !storageInfo.retried && hasOwnNotes()){ storageInfo.retried = true; askPersist(); }
  }, function(e){ saving = null; setSaved("Not saved"); toast("Couldn't save. Your phone may be out of space. Try saving a backup file from Share."); console.warn(e); });
  return saving;
}
function saveMeta(){ return store.set("meta", JSON.parse(JSON.stringify(meta))).catch(function(e){ console.warn(e); }); }
function setSaved(t){ var el = $("#saved"); if (el) el.textContent = t; }
/* Save straight away whenever the app is hidden, closed, reloaded, or loses focus. */
function saveAll(){ flushEditor(); saveNow(); }
document.addEventListener("visibilitychange", function(){ if (document.visibilityState === "hidden") saveAll(); else checkForNewer(); });
window.addEventListener("pagehide", saveAll);
window.addEventListener("beforeunload", saveAll);
window.addEventListener("blur", saveAll);
window.addEventListener("focus", function(){ checkForNewer(); });

/* Combine two sets of changes made from the same starting point (base): mine (this window) and theirs (another one).
   Works item by item using ids. Nothing typed is lost: if the same part was changed in both, both versions are kept. */
function same(a, b){ return JSON.stringify(a) === JSON.stringify(b); }
function merge3(base, mine, theirs, report){
  var KIDS = ["topics", "subsections", null], WORD = ["section", "topic", "part"];
  report = report || {};
  function byId(a){ var m = {}; a.forEach(function(x){ if (x && x.id) m[x.id] = x; }); return m; }
  function item(b, o, t, lv){
    var kids = KIDS[lv];
    if (!b){ if (o && t) return same(o, t) ? t : item(t, o, t, lv); return o || t || null; }
    if (!o && !t) return null;
    if (!o){ if (same(b, t)) return null; (report.keptHere = report.keptHere || []).push(WORD[lv]); return t; }  /* deleted here; kept because it was changed in the other window */
    if (!t){ if (same(b, o)) return null; (report.keptThere = report.keptThere || []).push(WORD[lv]); return o; }  /* deleted there; kept because it was changed here */
    var r = {}, clash = false;
    Object.keys(Object.assign({}, b, t, o)).forEach(function(k){
      if (k === kids) return;
      var oc = !same(o[k], b[k]), tc = !same(t[k], b[k]);
      if (oc || t[k] !== undefined) r[k] = oc ? o[k] : t[k];
      if (oc && tc && !same(o[k], t[k])) clash = true;
    });
    if (kids){ r[kids] = list(b[kids], o[kids], t[kids], lv + 1); return r; }
    if (clash){ var c = JSON.parse(JSON.stringify(t)); c.id = uid(); c.title = cleanTitle((t.title ? t.title + " " : "") + "(from another window)"); return [r, c]; }
    return r;
  }
  function list(b, o, t, lv){
    b = b || []; o = o || []; t = t || [];
    var B = byId(b), O = byId(o), T = byId(t);
    var mineMoved = !same(o.filter(function(x){ return B[x.id]; }).map(function(x){ return x.id; }), b.filter(function(x){ return O[x.id]; }).map(function(x){ return x.id; }));
    var first = mineMoved ? o : t, second = mineMoved ? t : o, out = [], seen = {};
    function put(x, at){ if (seen[x.id]) return; seen[x.id] = 1; var r = item(B[x.id], O[x.id], T[x.id], lv); if (!r) return; r = [].concat(r); if (at == null) out = out.concat(r); else Array.prototype.splice.apply(out, [at, 0].concat(r)); }
    first.forEach(function(x){ put(x); });
    second.forEach(function(x, i){
      if (seen[x.id]) return;
      var at = 0; for (var k = i - 1; k >= 0; k--){ var p = idx(out, second[k].id); if (p >= 0){ at = p + 1; break; } }
      put(x, at);
    });
    return out;
  }
  return { sections: list(base.sections, mine.sections, theirs.sections, 0) };
}
/* If another window saved newer notes, show them here (unless something is being changed here right now). */
function checkForNewer(){
  if (!loaded || savePending || saving || ed.subId || drag) return Promise.resolve(false);
  return store.get("data").then(function(d){
    if (!d || typeof d.rev !== "number" || d.rev === rev || !Array.isArray(d.sections) || savePending || saving || ed.subId || drag) return false;
    data = { sections: d.sections }; rev = d.rev; baseJSON = JSON.stringify({sections:d.sections});
    refreshView(); keptMessage({}); return true;
  }, function(){ return false; });
}
function refreshView(){ if (route().view === "e" || drag) return; render(); }
/* Something deleted in one window but changed in another is kept (so no words are lost). Say so, in both windows. */
var deletedHere = {};
function keptMessage(report){
  var lines = [];
  if (report.keptThere) lines.push("A " + report.keptThere[0] + " that was deleted in another tab or window had changes here, so it was kept.");
  var back = Object.keys(deletedHere).filter(function(id){ return findSection(id) || findTopic(id) || findSub(id); });
  if (back.length || report.keptHere) lines.push("A " + (back.length ? deletedHere[back[0]] : report.keptHere[0]) + " you deleted was changed in another tab or window, so it was kept. Delete it again if you don’t need it.");
  back.forEach(function(id){ delete deletedHere[id]; });
  if (lines.length) banner(lines.join(" "));
}

/* Text being typed is also copied at once into simple storage, so it survives an instant reload or crash. */
function pendingKey(){ return "wa-pending-" + COPY_ID + "-"; }
function keepPending(){
  if (!ed.subId) return; var f = findSub(ed.subId), box = $("#ed"), ti = $("#subTitle"); if (!f || !box || !ti) return;
  try { localStorage.setItem(pendingKey() + TAB, JSON.stringify({sub:ed.subId, topic:f.topic.id, title:ti.value, html:box.innerHTML, at:Date.now()})); } catch(e){}
}
function clearPending(before){ try { var k = pendingKey() + TAB, p = JSON.parse(localStorage.getItem(k) || "null"); if (p && !(p.at > before)) localStorage.removeItem(k); } catch(e){} }
function applyPending(){
  var changed = false;
  try {
    for (var i = localStorage.length - 1; i >= 0; i--){
      var k = localStorage.key(i); if (!k || k.indexOf(pendingKey()) !== 0) continue;
      var p = null; try { p = JSON.parse(localStorage.getItem(k)); } catch(e){}
      localStorage.removeItem(k);
      if (!p || !okId(p.sub)) continue;
      var html = sanitize(p.html), title = cleanTitle(p.title), f = findSub(p.sub);
      if (f){ if (f.sub.html !== html || f.sub.title !== title){ f.sub.html = html; f.sub.title = title; changed = true; } }
      else { var t = okId(p.topic) && findTopic(p.topic); if (t && (html || title)){ t.topic.subsections.push({ id:p.sub, title:title, html:html }); changed = true; } }
    }
  } catch(e){ console.warn(e); }
  return changed;
}

/* ---------- finding things ---------- */
function findSection(id){ for (var i=0;i<data.sections.length;i++) if (data.sections[i].id === id) return data.sections[i]; return null; }
function findTopic(id){ for (var i=0;i<data.sections.length;i++){ var s = data.sections[i]; for (var j=0;j<s.topics.length;j++) if (s.topics[j].id === id) return {section:s, topic:s.topics[j]}; } return null; }
function findSub(id){ for (var i=0;i<data.sections.length;i++){ var s = data.sections[i]; for (var j=0;j<s.topics.length;j++){ var t = s.topics[j]; for (var k=0;k<t.subsections.length;k++) if (t.subsections[k].id === id) return {section:s, topic:t, sub:t.subsections[k]}; } } return null; }
function allIds(){ var set = {}; data.sections.forEach(function(s){ set[s.id]=1; s.topics.forEach(function(t){ set[t.id]=1; t.subsections.forEach(function(u){ set[u.id]=1; }); }); }); return set; }
function move(arr, i, d){ var j = i + d; if (j < 0 || j >= arr.length) return; var x = arr[i]; arr[i] = arr[j]; arr[j] = x; }
function idx(arr, id){ for (var i=0;i<arr.length;i++) if (arr[i].id === id) return i; return -1; }

/* ---------- pop-up questions and messages ---------- */
/* Pop-ups and the phone's Back button. Opening a pop-up adds a step to the browser history, so Back closes the
   pop-up first (like Cancel). Closing it with its own buttons takes that step out again, so Back isn't needed twice. */
var sheet = null, sheetSeq = 0, skipPop = 0;
function sheetOpened(onBack){
  var id = ++sheetSeq; sheet = { id:id, onBack:onBack, pushed:false };
  try { history.pushState({ waSheet:id }, "", location.href); sheet.pushed = true; } catch(e){}
  fitSheet(); return id;
}
function sheetClosed(id){
  if (!sheet || sheet.id !== id) return Promise.resolve();
  var sh = sheet; sheet = null;
  if (!sh.pushed || !(history.state && history.state.waSheet === id)) return Promise.resolve();
  return new Promise(function(res){
    var t, finished = false;
    function fin(){ if (finished) return; finished = true; window.removeEventListener("popstate", fin); clearTimeout(t); res(); }
    skipPop++; window.addEventListener("popstate", fin);
    t = setTimeout(function(){ if (skipPop) skipPop--; fin(); }, 700);
    history.back();
  });
}
window.addEventListener("popstate", function(e){
  if (skipPop){ skipPop--; return; }
  if (sheet && !(e.state && e.state.waSheet === sheet.id)){ var sh = sheet; sheet = null; sh.onBack(); }
});
/* Keep the pop-up above the on-screen keyboard: size it to the part of the screen that is really visible. */
function fitSheet(){
  var m = $("#modal"); if (!m || !m.classList.contains("show")) return;
  var vv = window.visualViewport;
  if (vv && vv.height > 0){ m.style.top = Math.max(0, vv.offsetTop) + "px"; m.style.left = Math.max(0, vv.offsetLeft) + "px"; m.style.width = vv.width + "px"; m.style.height = vv.height + "px"; m.style.right = "auto"; m.style.bottom = "auto"; }
  var f = document.activeElement;
  if (f && m.contains(f) && /^(INPUT|TEXTAREA)$/.test(f.tagName)){ try { f.scrollIntoView({ block:"nearest" }); } catch(e){} }
}
if (window.visualViewport){ window.visualViewport.addEventListener("resize", fitSheet); window.visualViewport.addEventListener("scroll", fitSheet); }
window.addEventListener("resize", fitSheet);
document.addEventListener("focusin", function(e){ var m = $("#modal"); if (m && m.contains(e.target)){ setTimeout(fitSheet, 60); setTimeout(fitSheet, 400); } });
/* Unfinished text in a pop-up that was canceled (or closed with Back) is kept and filled in next time. */
var drafts = {};
/* One pop-up at a time: a second one waits until the first is closed, so nothing typed is lost. */
var modalBusy = false, modalQueue = [];
function whenFree(fn){ if (modalBusy) modalQueue.push(fn); else { modalBusy = true; fn(); } }
function freeModal(){ var next = modalQueue.shift(); if (next) next(); else modalBusy = false; }
function modal(opts){
  return new Promise(function(resolve){ whenFree(function(){
    var m = $("#modal");
    var fields = opts.fields || [];
    var dkey = (opts.title || "") + "\u0001" + fields.map(function(f){ return f.value || ""; }).join("\u0001"), draft = fields.length ? drafts[dkey] : null;
    var h = '<form class="sheet" novalidate autocomplete="off"><h2>' + esc(opts.title||"") + '</h2>' + (opts.alert ? '<p class="alert" role="alert">' + esc(opts.alert) + '</p>' : '') + (opts.message ? '<p class="msg">' + esc(opts.message) + '</p>' : '');
    if (draft) h += '<p class="hint draftnote">Your unfinished text from last time is filled in.</p>';
    fields.forEach(function(f, i){ var last = i === fields.length - 1; h += '<label class="fl" for="mf'+i+'">' + esc(f.label) + '</label><input class="text" id="mf'+i+'" type="'+(f.type||"text")+'" autocomplete="off" enterkeyhint="' + (last ? (fields.length === 1 ? "go" : "done") : "next") + '" '+(f.type==="url"?'inputmode="url" autocapitalize="off"':'autocapitalize="sentences"')+' placeholder="'+esc(f.placeholder||"")+'" value="'+esc(draft ? draft[i] : (f.value||""))+'">'; });
    if (opts.choices) h += '<div class="choices">' + opts.choices.map(function(c, i){ return '<button type="button" data-choice="' + i + '" class="' + esc(c.cls || "") + '">' + esc(c.label) + (c.why ? '<span class="why">' + esc(c.why) + '</span>' : '') + '</button>'; }).join("") + '</div>';
    h += '<div class="btns">' + (opts.cancel === false ? '' : '<button type="button" class="no">' + esc(opts.cancel||"Cancel") + '</button>') + (opts.choices && !opts.ok ? '' : '<button type="submit" class="ok' + (opts.danger?' red':'') + '">' + esc(opts.ok||"OK") + '</button>') + '</div></form>';
    m.innerHTML = h; m.classList.add("show");
    var form = $("form", m), closing = false, id;
    var first = $("#mf0", m);
    if (first){ setTimeout(function(){ if (closing || m.contains(document.activeElement)) return; first.focus(); try { first.select(); } catch(e){} }, 30); } else { setTimeout(function(){ var o = $(".ok", m) || $(".choices button", m); if (o) o.focus(); }, 30); }
    function values(){ return fields.map(function(f, i){ return $("#mf"+i, m).value; }); }
    function edited(){ var v = values(); return fields.some(function(f, i){ return cleanTitle(v[i]) !== cleanTitle(f.value || ""); }); }
    function done(val, keepDraft){
      if (closing) return; closing = true;
      if (fields.length){ if (keepDraft && edited()) drafts[dkey] = values(); else delete drafts[dkey]; }
      m.classList.remove("show"); m.innerHTML = ""; document.removeEventListener("keydown", key);
      sheetClosed(id).then(function(){ resolve(val); setTimeout(freeModal, 0); });  /* let any screen change from this answer happen before the next pop-up opens */
    }
    function cancel(){ done(null, true); }
    /* run() and onOk() are called right inside the tap, so the phone lets them open a file picker or the share menu. */
    function runNow(fn){ var r; try { r = fn(); } catch(e){ r = Promise.reject(e); } return r; }
    function ok(){ if (opts.choices && !opts.ok) return; if (opts.onOk && !fields.length) return done({ result: runNow(opts.onOk) }); if (!fields.length) return done(true); var vals = values(); if (fields.length === 1 && !cleanTitle(vals[0]) && fields[0].required !== false){ $("#mf0", m).focus(); return; } done(fields.length === 1 ? vals[0] : vals, false); }
    /* Enter (or Go / Next on a phone keyboard): next field, or OK from the last one. */
    function enter(el){ var i = fields.length ? Array.prototype.indexOf.call(m.querySelectorAll("input.text"), el) : -1; if (i >= 0 && i < fields.length - 1){ var nx = $("#mf"+(i+1), m); nx.focus(); try { nx.select(); } catch(e){} } else ok(); }
    function key(e){ if (closing) return; if (e.key === "Escape") cancel(); else if (e.key === "Enter" && e.target.tagName === "INPUT" && m.contains(e.target)){ e.preventDefault(); enter(e.target); } }
    document.addEventListener("keydown", key);
    form.addEventListener("submit", function(e){ e.preventDefault(); var a = document.activeElement; if (a && a.tagName === "INPUT" && m.contains(a)) enter(a); else ok(); });
    var no = $(".no", m); if (no) no.onclick = cancel;
    m.querySelectorAll("[data-choice]").forEach(function(btn){ btn.onclick = function(){ var c = opts.choices[+btn.getAttribute("data-choice")]; done({ value: c.value, result: c.run ? runNow(c.run) : undefined }); }; });
    m.onclick = function(e){ if (e.target === m && opts.cancel !== false) cancel(); };
    id = sheetOpened(cancel);
  }); });
}
function ask(title, label, value, okText){ return modal({title:title, fields:[{label:label, value:value||""}], ok:okText||"Save"}).then(function(v){ return v == null ? null : cleanTitle(v); }); }
function confirmDelete(what){ return modal({title:"Delete " + what + "?", message:"This can't be undone. (Tip: if you're unsure, make a backup first with 🛟 Back up on the main screen.)", ok:"Delete", cancel:"Keep it", danger:true}); }
function info(title, message){ return modal({title:title, message:message, ok:"OK", cancel:false}); }
var toastTimer;
function toast(t, ms){ var el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(function(){ el.classList.remove("show"); }, ms || 3200); }
function hideToast(){ clearTimeout(toastTimer); var el = $("#toast"); if (el) el.classList.remove("show"); }
/* A notice that doesn't block anything (used when the app is open in another tab or window). */
function banner(t){ var el = $("#banner"); el.innerHTML = '<span></span><button type="button">OK</button>'; el.firstChild.textContent = t; el.classList.add("show"); el.querySelector("button").onclick = function(){ el.classList.remove("show"); }; }

/* ---------- moving around ---------- */
var ui = { arrange:false, sel:null, leave:null, lastView:"" };
var navStack = [];
function route(){ var h = (location.hash || "#/").replace(/^#\/?/, ""); var p = h.split("/"); return {view:p[0]||"home", id:decodeURIComponent(p[1]||""), sub:p[2]||""}; }
function go(hash){ if (location.hash === hash) render(); else location.hash = hash; }
function goBack(parent){ if (navStack.length > 1 && navStack[navStack.length-2] === parent) history.back(); else go(parent); }
window.addEventListener("hashchange", function(){
  var h = location.hash || "#/";
  if (navStack.length > 1 && navStack[navStack.length-2] === h) navStack.pop(); else navStack.push(h);
  render(true);
  checkForNewer();
  if (ui.then){ var nx = ui.then; ui.then = null; go(nx); }
});

function header(backTo, backLabel, title, right){
  return '<header class="top">' + (backTo ? '<button class="tbtn" data-act="back" data-to="'+esc(backTo)+'" aria-label="'+(backLabel === "Done" ? "Done" : "Back to "+esc(backLabel))+'">‹ <span class="bl">' + esc(backLabel) + '</span></button>' : '') +
    '<h1>' + esc(title) + '</h1><span class="saved" id="saved"></span>' + (right||"") + '</header>';
}

function render(navigated){
  if (ui.leave){ var f = ui.leave; ui.leave = null; f(); }
  var r = route(), y = window.scrollY, html = "";
  var key = r.view + "/" + r.id;
  if (navigated || key !== ui.lastView) { ui.arrange = false; }
  var same = key === ui.lastView;
  if (ui.lastView.indexOf("share/") === 0 && key.indexOf("share/") !== 0) hideToast();
  ui.lastView = key;
  if (r.view === "home") html = viewHome();
  else if (r.view === "s") html = viewSection(r.id);
  else if (r.view === "t") html = viewTopic(r.id);
  else if (r.view === "e") html = viewEditor(r.id);
  else if (r.view === "share") html = viewShare();
  else if (r.view === "help") html = viewHelp();
  else if (r.view === "backup") html = viewBackup();
  else if (r.view === "print") html = viewPrint();
  else if (r.view === "search") html = viewSearch();
  else { location.replace("#/"); return; }
  if (html == null) return; // view redirected
  $("#app").innerHTML = html;
  if (r.view === "e") setupEditor(r.id);
  if (r.view === "share") updatePicker();
  if (r.view === "search") setupSearch();
  window.scrollTo(0, same ? y : 0);
  if (r.view !== "e") watchBars();
  refreshUpdateNote();
  if (r.view === "t" && r.sub && navigated){ var card = document.querySelector('.card[data-sub="' + r.sub + '"]'); if (card){ card.scrollIntoView({block:"center"}); card.classList.add("flash"); } }
}

function viewHelp(){
  var h = header("#/", "Sections", "How to use") + '<main class="help">';
  h += '<section class="panel"><h2 style="margin-top:0">Writing</h2><ol><li><b>Sections</b> are your big groups (for example “The Deity of Christ”). Tap <b>＋ New section</b>.</li><li>Open a section and tap <b>＋ New topic</b>. Give it a name and start typing right away.</li><li>Tap the heading or the writing box to start typing.</li><li>A topic is made of <b>parts</b>, like the pieces of a tract. Tap <b>＋ Add a part</b> for the next piece, and <b>✎ Edit</b> to change one.</li><li>While editing, use the buttons for <b>Bold</b>, <i>Italic</i>, <b>Heading</b>, <b>Subheading</b>, <b>Quote</b> (a box for Bible verses), lists, <b>Link</b>, and <b>Picture</b>. Pictures are made smaller automatically so files stay small. Tap a picture while editing to make it small, medium, or full width, or to add a caption.</li><li>To rename, reorder, or delete, tap <b>✎ Change order, names, or delete</b> at the bottom of a list. Move things with the ↑ ↓ buttons, or press and drag the <b>≡ Drag</b> handle. Tap <b>✓ Done changing</b> when finished.</li><li>The phone’s <b>Back</b> button closes a pop-up first (anything you typed in it is kept for next time), then goes back one screen at a time.</li><li>To find something, tap <b>🔍 Search your notes</b> on the main screen and type a word. Tap a result to open it. If a word is spelled a little differently, close matches are shown.</li></ol></section>';
  h += '<section class="panel"><h2 style="margin-top:0">Put it on your home screen</h2><p>Open the app’s web address once while online. Then add it to your home screen: on <b>iPhone</b> (Safari), tap Share (the square with an arrow), then <b>Add to Home Screen</b>. On <b>Android</b> (Chrome), tap ⋮, then <b>Install and create shortcut</b>, then <b>Install</b> (not “Create shortcut”). On some phones the menu item is called <b>Install app</b> or <b>Add to Home screen</b>. After that it opens like an app and works with no internet.</p><p id="iphonepointer">On iPhone: if you already wrote notes in Safari, see <b>Keeping your notes safe</b> below first.</p><p id="installtip">If you don’t see the icon on your home screen, look in your app drawer. To put it on your home screen, long-press the icon and pick Add to Home.</p>' + (HOSTED ? '<p>This app’s web address (send it to anyone who wants the app):<br><span class="addr" id="addr">' + esc(location.origin + location.pathname) + '</span></p>' : '<p>You opened this app as a saved file, so it has no web address here. To give it to someone, use <b>⇪ Share</b> → “Blank app”.</p>') + '</section>';
  h += '<section class="panel" id="backHelp"><h2 style="margin-top:0">Backing up</h2><p>Your notes are kept inside this browser on this phone. Now and then, tap <b>🛟 Back up</b> on the main screen. It saves everything in one backup file that this app can bring back.</p><ul><li><b>On Android (Chrome):</b> the first time, your phone asks where to keep the file (for example Downloads or Google Drive). After that, each tap updates that same file, with no questions. After a restart, your phone may ask once more: tap <b>Allow</b>. To use a different place, open <b>📄 PDF and more backup choices</b> and tap <b>Change save spot</b> or <b>Forget save spot</b>.</li><li><b>On iPhone and other browsers:</b> each tap opens the share menu. Choose <b>Save to Files</b>, Google Drive, or email it to yourself.</li><li>When you have changed something since your last backup, the button turns yellow and says <b>You have changes since your last backup</b>.</li><li><b>Save as PDF (readable)</b>, in PDF and more backup choices, makes a booklet of all your notes that anyone can open. Before your phone’s print screen opens, the app tells you which button saves the PDF.</li></ul><p>Keep the file somewhere other than this phone. If you haven’t made a backup for 30 days, the main screen reminds you (a PDF doesn’t count, because it can’t be brought back).</p></section>';
  h += '<section class="panel" id="restoreHelp"><h2 style="margin-top:0">Restoring</h2><p>At the bottom of the main screen, tap <b>⤒ Choose a backup file</b> under <b>Restore from a backup</b>. Then pick one of two choices:</p><ul><li><b>Add to my notes</b> (safe, recommended). Nothing on this phone is changed or removed. Anything in the backup that isn’t here is added. Each part is compared word for word: an exact copy is skipped, and if a part differs even by one word, both versions are kept, with the backup’s version marked “(from backup)” right after yours. Afterward you see how many parts were added, kept twice, or skipped.</li><li><b>Replace everything with this backup</b>. This replaces ALL notes on this phone with the backup, so changes made since that backup are lost. It’s offered only for a full backup file: one from <b>🛟 Back up</b>, from <b>⇪ Send a copy somewhere else (email, Drive)…</b> or <b>⤓ Save a dated copy</b> on the <b>Back up / Save all</b> screen (on Android, these show after the first save), or from <b>⇪ Share</b> with every section checked. The file says inside how many sections and parts it has, and Replace is offered only if that still matches. A file with only some sections, like one shared from a section, can only be added to your notes. So can a backup made before version 0.11, because it looks the same inside as a shared file. The warning shows how many sections and parts the backup has compared with this phone, and warns you in bold when the backup is much smaller.</li></ul><p id="safetyHelp"><b>Safety copies.</b> Before each replace, the app keeps a copy of your notes as they were. It keeps the last 3, each with its date and how many sections and parts it has, listed under <b>Safety copies</b> in Restore on the main screen. For each one you can <b>Restore this copy</b>, <b>Save as a file</b>, or <b>Delete</b> it (the app asks first). <b>Undo last replace</b> puts back the newest one. Putting a copy back keeps the notes you had a moment ago as a copy in its place, so you can always switch back. If you already have 3, a replace first asks you to save the oldest one as a file. Only then is it removed from the app to make room, so a replace or undo never loses your notes. Safety copies are kept on this phone only, in the same place as your notes, so they don’t replace a backup file kept somewhere else.</p><p id="olderHelp">' + OLDER_BACKUP + '</p></section>';
  h += '<section class="panel" id="safety"><h2 style="margin-top:0">Keeping your notes safe</h2><div class="storageStatus">' + storageHtml() + '</div><p><b>What can erase your notes on Android (Chrome):</b></p><ul>' +
    '<li><b>Clearing Chrome’s data.</b> “Delete browsing data” with <b>Cookies and site data</b> checked, or deleting this site’s data in Chrome’s settings. So does Android <b>Settings → Apps → Chrome → Storage → Clear storage</b>, uninstalling Chrome, or a cleaner app that clears Chrome’s data.</li>' +
    '<li><b>Blocking on-device site data</b> for this site in Chrome’s Site settings hides your notes from the app (and may erase them).</li>' +
    '<li><b>Removing the app’s icon</b> (uninstalling the app) doesn’t erase the notes by itself. They’re kept in Chrome, not in the icon.</li>' +
    '<li><b>Phone very low on space:</b> if your notes aren’t protected (see above), Chrome may clear them by itself. This is rare.</li>' +
    '<li><b>Factory reset or a new phone:</b> notes don’t move by themselves, and signing in to Chrome doesn’t copy them. Bring your backup file across and use <b>Restore from a backup</b> on the main screen.</li>' +
    '<li><b>Each browser and each web address keeps its own notes.</b> Notes in Chrome aren’t in Samsung Internet, a saved copy of the app has its own notes, and if the app ever moves to a new web address, it starts empty there. Use a backup file to move them.</li>' +
    '<li><b>Incognito</b> (private) tabs forget everything when they’re closed.</li>' +
    '<li><b>Safe:</b> updates to this app, to Chrome, and to Android don’t erase your notes.</li></ul>' +
    '<p id="iphonehelp"><b>On iPhone:</b> ' + IPHONE_NOTE + '</p></section>';
  h += '<section class="panel"><h2 style="margin-top:0">Sharing</h2><ul><li><b>Some notes:</b> in Share, check the sections or topics you want and tap Send or Save. The other person opens the file with <b>Bring in notes</b> in their copy. It is added next to their notes; nothing of theirs is replaced.</li><li><b>The app itself:</b> “Blank app” gives a clean copy. “App with the checked notes built in” gives a copy that already has those notes.</li><li>If a part you send has different words from a part they already have, both are kept: yours is added right after theirs, marked “(imported)”. Exact copies are skipped.</li><li><b>Copies of the app:</b> a copy saved from Share (“Blank app” or “App with the checked notes built in”) keeps its own notes, so it won’t mix with yours, even on the same phone. But the <b>same</b> app opened twice (two tabs, or the same file opened again) shares one set of notes on that phone. That’s fine: changes from both are combined, and nothing is lost.</li></ul></section>';
  h += '<p class="ver" id="helpver">Version ' + esc(APP_VERSION) + '. When a new version is ready, a green note at the top says “New version ready — tap to update”.</p>';
  h += '<section class="panel"><h2 style="margin-top:0">Samples</h2><p>The “Sample” sections show how things work. Delete them whenever you like. Scripture in the samples is from the King James Version.</p><button class="plain" data-act="addSamples">Put the sample sections back</button></section>';
  h += '</main>';
  return h;
}

var storageInfo = { supported: !!(navigator.storage && navigator.storage.persist), persisted: null, usage: null, retried: false, calls: 0 };
/* Ask the browser not to clear the notes by itself (Chrome decides on its own, without asking the user). */
function askPersist(){
  if (!storageInfo.supported) return Promise.resolve(false);
  storageInfo.calls++;
  var p; try { p = navigator.storage.persist(); } catch(e){ p = Promise.reject(e); }
  return Promise.resolve(p).then(function(ok){ storageInfo.persisted = !!ok; }, function(){ storageInfo.persisted = false; }).then(function(){
    if (navigator.storage.estimate) return navigator.storage.estimate().then(function(est){ storageInfo.usage = est && est.usage; }, function(){});
  }).then(function(){ document.querySelectorAll(".storageStatus").forEach(function(el){ el.innerHTML = storageHtml(); }); return storageInfo.persisted; });
}
function storageHtml(){
  var h;
  if (!storageInfo.supported) h = '<p class="safe-warn">This browser doesn’t say whether it protects your notes. Keep a backup file to be safe.</p>';
  else if (storageInfo.persisted === null) h = '<p>Checking…</p>';
  else if (storageInfo.persisted) h = '<p class="safe-ok">✅ <b>Protected.</b> This browser has agreed not to clear your notes by itself, even if the phone runs low on space. You can still erase them yourself, for example by clearing ' + esc(browserName() ? browserName() + '’s' : 'this browser’s') + ' data (see below).</p>' + (isIOS() ? '<p class="hint"><b>On iPhone:</b> ' + IPHONE_NOTE + '</p>' : '');
  else h = '<p class="safe-warn">⚠️ <b>Not protected yet.</b> Your notes are saved, but if the phone runs very low on space, ' + esc(browserLabel()) + ' could clear them by itself. It decides this on its own, without asking you, and usually protects an app once it’s installed or used often. The app asks again each time it opens. Keep a backup file to be safe.</p>' + (isIOS() ? '<p class="hint"><b>On iPhone:</b> ' + IPHONE_NOTE + '</p>' : '');
  if (storageInfo.usage) h += '<p class="hint">The app and your notes use about ' + fmtSize(storageInfo.usage) + ' on this device.</p>';
  return h;
}
var IPHONE_NOTE = 'The app on your Home Screen keeps its own notes, separate from Safari’s. Before you switch, tap <b>🛟 Back up</b> in Safari and save the file to Files, then open the Home Screen app and use <b>Restore from a backup</b> on the main screen. Safari also erases a website’s notes after 7 days of using Safari without opening that site; apps on the Home Screen aren’t erased this way.';
function browserName(){ var u = navigator.userAgent || ""; if (/SamsungBrowser/i.test(u)) return "Samsung Internet"; if (/EdgA?\/|EdgiOS/.test(u)) return "Edge"; if (/Firefox|FxiOS/.test(u)) return "Firefox"; if (/CriOS/.test(u)) return "Chrome"; if (/OPR\//.test(u)) return ""; if (/Chrome\//.test(u)) return "Chrome"; if (/Safari\//.test(u) && /AppleWebKit/.test(u)) return "Safari"; return ""; }
function browserLabel(){ var n = browserName(); return n ? "this browser (" + n + ")" : "this browser"; }
function isIOS(){ return /iPhone|iPad|iPod/.test(navigator.userAgent || "") || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); }
function hasOwnNotes(){ return data.sections.some(function(s){ return !s.sample; }); }
function noteBackup(kind){ meta.backup = meta.backup || {}; meta.backup[kind] = now(); if (kind === "full") meta.remindSnooze = null; /* only a full backup ends a "Not now" snooze */ saveMeta(); }
/* Only a full .witness.json backup counts for the reminder: a PDF or readable copy can't be brought back into the app. */
function lastBackupTime(){ var b = meta.backup || {}, t = b.full ? Date.parse(b.full) : NaN; return isFinite(t) ? t : null; }
var GRACE_DAYS = 3;
function firstOwnNoteTime(){ var t = []; data.sections.forEach(function(s){ if (!s.sample){ var c = Date.parse(s.created || ""); t.push(isFinite(c) ? c : Date.now()); } }); return t.length ? Math.min.apply(null, t) : null; }
function daysSince(t){ return Math.max(0, Math.floor((Date.now() - t) / 86400000)); }
function needsReminder(){
  if (!hasOwnNotes()) return false;
  if (meta.remindSnooze && Date.parse(meta.remindSnooze) > Date.now()) return false;
  var t = lastBackupTime();
  if (t == null){ var f = firstOwnNoteTime(); return f != null && daysSince(f) >= GRACE_DAYS; }  /* a few days' grace before the first reminder */
  return daysSince(t) >= 30;
}
function fmtDate(t){ try { return new Date(t).toLocaleDateString("en-US", {day:"numeric", month:"long", year:"numeric"}); } catch(e){ return new Date(t).toDateString(); } }
function whenText(t){ var d = daysSince(t); return fmtDate(t) + (d === 0 ? " (today)" : d === 1 ? " (yesterday)" : " (" + d + " days ago)"); }
function backupName(){ return "witnessing-notes-backup-" + today() + ".witness.json"; }
/* ---------- the one "Back up" button ----------
   Where the phone lets a web app keep updating one chosen file (Chrome on Android and computers), the first tap asks
   where to keep it, and each later tap replaces that same file. Everywhere else (iPhone, Firefox…), each tap opens the
   share menu with a full backup file, or saves a dated copy if sharing isn't available. */
var SPOT_NAME = "my-witnessing-notes.witness.json";
var spot = { handle:null, ready:false };
function pickerOK(){ return typeof window.showSaveFilePicker === "function" && store.mode() === "idb"; }
function isStandalone(){ try { return !!((window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true); } catch(e){ return false; } }
function iosApp(){ return isIOS() && isStandalone(); }
function dataSig(){ var t = snap(); return hashStr(t) + "-" + t.length; }
function changedSinceBackup(){ if (!meta.backupSig) return hasOwnNotes(); return meta.backupSig !== dataSig(); }
function fullBackupText(){ return JSON.stringify(fullExport(JSON.parse(snap()).sections), null, 1); }
function spotName(){ return spot.handle ? (spot.handle.name || (meta.saveSpot && meta.saveSpot.name) || SPOT_NAME) : ""; }
function backupDone(how, sig){ meta.backupSig = sig; meta.backupHow = how; noteBackup("full"); render(); }
function named(name, msg){ var e = new Error(msg || name); e.name = name; return e; }
function smartBackup(){
  flushEditor();
  if (!data.sections.length){ info("Nothing to back up yet", "You have no sections yet."); return Promise.resolve(false); }
  var text = fullBackupText(), sig = dataSig();
  if (pickerOK() && !spot.ready){ toast("One moment, the app is still opening…"); return Promise.resolve(false); }
  if (pickerOK()) return spot.handle ? saveToSpot(text, sig) : firstSpot(text, sig);
  return shareBackup(text, sig);
}
function firstSpot(text, sig){
  return modal({ title:"Choose where to keep your backup", message:"Your phone will ask where to save the backup file. Pick a place you can find again, like Downloads or Google Drive, and tap Save.\n\nAfter that, each time you tap Back up, the app updates that same file. You won’t have to choose again.", ok:"Choose a spot", cancel:"Cancel", onOk:function(){ return pickAndSave(text, sig); } })
    .then(function(r){ return r ? r.result : false; });
}
function writeHandle(h, text){
  return Promise.resolve(h.createWritable()).then(function(w){ return Promise.resolve(w.write(text)).then(function(){ return w.close(); }, function(e){ try { w.abort(); } catch(x){} throw e; }); });
}
function pickAndSave(text, sig){
  var p; try { p = window.showSaveFilePicker({ suggestedName:SPOT_NAME, types:[{ description:"Notes backup file", accept:{ "application/json":[".json"] } }] }); } catch(e){ p = Promise.reject(e); }
  return Promise.resolve(p).then(function(h){
    return writeHandle(h, text).then(function(){
      spot.handle = h; meta.saveSpot = { name: h.name || SPOT_NAME, at: now() };
      return store.set("saveHandle", h).catch(function(e){ console.warn("save spot not kept", e); });
    }).then(function(){ backupDone("file", sig); toast("Backed up to “" + spotName() + "”."); return true; });
  }, function(e){ if (e && e.name === "AbortError"){ toast("No save spot chosen, so nothing was saved."); return false; } throw e; })
  .catch(function(e){ return saveFailed(e, text, sig, false); });
}
function saveToSpot(text, sig){
  var h = spot.handle, mode = { mode:"readwrite" };
  return Promise.resolve().then(function(){ return h.queryPermission ? h.queryPermission(mode) : "granted"; }).then(function(st){
    if (st === "granted") return;
    if (st === "denied") throw named("NotAllowedError");

    toast("Your phone asks once after a restart. Tap Allow.", 6000);
    return Promise.resolve(h.requestPermission(mode)).then(function(s2){ if (s2 !== "granted") throw named("NotAllowedError"); });
  }).then(function(){ return writeHandle(h, text); }).then(function(){
    meta.saveSpot = { name: spotName(), at: now() }; backupDone("file", sig); toast("Backed up to “" + spotName() + "”."); return true;
  }).catch(function(e){ return saveFailed(e, text, sig, true); });
}
function saveFailed(e, text, sig, hadSpot){
  console.warn("backup save", e);
  var n = e && e.name, f = "“" + (spotName() || SPOT_NAME) + "”", title, msg;
  if (n === "NotAllowedError"){ title = "Saving wasn’t allowed"; msg = "Your phone didn’t let the app update " + f + ". You can try again and tap Allow, choose a new save spot, or save a copy another way."; }
  else if (n === "NotFoundError" || n === "NotReadableError" || n === "InvalidStateError"){ title = "Couldn’t find your backup file"; msg = f + " may have been moved, renamed, or deleted. Choose a save spot again, or save a copy another way."; }
  else if (n === "SecurityError"){ title = "One more tap, please"; msg = "Your phone needs one more tap before it can save."; }
  else { title = "Couldn’t save the backup"; msg = "Something went wrong while saving" + (hadSpot ? " to " + f : "") + ". Your notes are still safe in the app. Try again, choose another save spot, or save a copy another way."; }
  var ch = [];
  if (hadSpot && n !== "NotFoundError" && n !== "NotReadableError" && n !== "InvalidStateError") ch.push({ label:"Try again", cls:"go", run:function(){ return saveToSpot(text, sig); } });
  if (!hadSpot && n === "SecurityError") ch.push({ label:"Choose a spot", cls:"go", run:function(){ return pickAndSave(text, sig); } });
  else ch.push({ label:"Choose a save spot", cls: ch.length ? "" : "go", run:function(){ return pickAndSave(text, sig); } });
  ch.push({ label: canShareFiles() ? "Share or save a copy instead" : "Download a copy instead", run:function(){ return shareBackup(text, sig); } });
  return modal({ title:title, message:msg, choices:ch, cancel:"Not now" }).then(function(r){ return r ? r.result : false; });
}
/* Share menu (Save to Files, Google Drive, email…), or a dated download where sharing isn't available. */
function shareBackup(text, sig){
  var name = backupName(), blob = new Blob([text], {type:"application/json"});
  if (canShareFiles()){
    var file = new File([blob], name, {type:"application/json"});
    if (navigator.canShare({files:[file]})) return Promise.resolve().then(function(){ return navigator.share({files:[file], title:name}); }).then(function(){
      backupDone("share", sig); toast("Backup file sent. Keep it somewhere safe."); return true;
    }, function(e){
      if (e && e.name === "AbortError"){ toast("Backup canceled, so nothing was saved."); return false; }
      if (iosApp() || (e && e.name === "NotAllowedError")) return modal({ title:"One more tap, please", message:"Your phone needs one more tap to open the share menu.", ok:"Share the backup", onOk:function(){ return shareBackup(text, sig); } }).then(function(r){ return r ? r.result : false; });
      return downloadBackup(blob, name, sig);

function downloadBackup(blob, name, sig){ download(blob, name); backupDone("download", sig); saved(name, "backup"); return Promise.resolve(true); }

function changeSpot(){ flushEditor(); if (!data.sections.length) return info("Nothing to back up yet", "You have no sections yet."); return pickAndSave(fullBackupText(), dataSig()); }

/* Write each link's full address after its words, so it can be read on paper. */

    var href = a.getAttribute("href"), shown = href.replace(/^(mailto|tel):/i, ""), bare = function(x){ return String(x).trim().replace(/^https?:\/\//i, "").replace(/^www\./i, "").replace(/\/$/, "").toLowerCase(); };

function docHtml(secs){

  else h += '<nav class="toc"><h2>Contents</h2><ol>' + secs.map(function(s){ return '<li>' + esc(s.title) + (s.topics.length ? '<ol>' + s.topics.map(function(t){ return '<li>' + esc(t.title) + '</li>'; }).join("") + '</ol>' : '') + '</li>'; }).join("") + '</ol></nav>';

var OLDER_BACKUP = 'Adding an <b>older</b> backup to your notes also brings back anything you deleted since then. Delete it again if you don’t want it. A part you changed since then comes back as a second version marked “(from backup)”, right after your newer one. Differences in spacing alone (extra spaces or line breaks) don’t count as a change.';
