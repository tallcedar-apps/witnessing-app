<style>
:root{--bg:#f7f3ec;--card:#fff;--ink:#1f2328;--muted:#5e6670;--line:#e3ddd2;--accent:#2f5d8a;--accent-soft:#e6eef6;--go:#2e7d4f;--go-dark:#256a42;--danger:#b3261e;--radius:14px}

button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.top{position:sticky;top:0;z-index:20;background:var(--accent);color:#fff;padding:calc(6px + env(safe-area-inset-top)) 8px 6px;display:flex;align-items:center;gap:6px;min-height:60px;box-shadow:0 1px 4px rgba(0,0,0,.15)}

.tbtn:active{background:rgba(255,255,255,.3)}
.saved{font-size:13px;opacity:.85;min-width:44px;text-align:right}

.lead{color:var(--muted);margin:2px 2px 14px;font-size:17px}
.list{display:flex;flex-direction:column;gap:10px;margin:0 0 16px;padding:0;list-style:none}
.row{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);display:flex;align-items:stretch;min-height:64px;overflow:hidden}

.plain.on{background:var(--accent-soft);border-color:var(--accent)}
.danger{color:var(--danger)}

.sheet .btns .warn{color:var(--danger)}

.res:active{background:var(--accent-soft)}
.res .kind{display:inline-block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 6px;margin-right:6px;vertical-align:2px}
.res .rt{font-weight:650;font-size:18px;overflow-wrap:anywhere}
.res .rp{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.res .rs{display:block;font-size:16px;margin-top:4px;overflow-wrap:anywhere}
mark{background:#ffe58a;color:inherit;border-radius:3px;padding:0 1px}
.card.flash{animation:flash 1.6s ease-out}

.toolbar button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.toolbar button:active{background:var(--accent-soft)}
.editor{min-height:45vh;background:#fff;border:1px solid #cfc7b8;border-radius:12px;padding:12px 14px;outline:none}
.editor:focus{border-color:var(--accent);box-shadow:0 0 0 3px #9cc0e4}
.editor:empty:before{content:attr(data-placeholder);color:#8a8f96}

.panel h2{margin:0 0 6px;font-size:21px}
.panel p{margin:4px 0 10px}
.pick{list-style:none;margin:6px 0 8px;padding:0}
.pick li{margin:0}

.pick .tp label{padding-left:36px;font-size:17px}
.pick input{width:32px;height:32px;flex:none;accent-color:var(--accent)}
.pick .sname{font-weight:650}
.two{display:flex;gap:8px}
.two>*{flex:1}
.help h2{font-size:21px;margin:18px 0 6px}
.help ol,.help ul{padding-left:24px}
.help li{margin:6px 0}
#modal{position:fixed;inset:0;background:rgba(20,25,30,.5);display:none;align-items:flex-end;justify-content:center;z-index:100;padding:10px;overflow:hidden}
#modal.show{display:flex}
.sheet{background:#fff;border-radius:18px;width:100%;max-width:520px;padding:18px 16px calc(14px + env(safe-area-inset-bottom));box-shadow:0 10px 40px rgba(0,0,0,.3);max-height:100%;overflow:auto;overscroll-behavior:contain;margin:0}
.sheet h2{margin:0 0 8px;font-size:21px}
.sheet .msg{margin:0 0 12px;white-space:pre-line}
.sheet .btns{display:flex;gap:8px;margin-top:14px;position:sticky;bottom:calc(-14px - env(safe-area-inset-bottom));background:#fff;padding:8px 0 4px}
.sheet input.text{scroll-margin-top:12px;scroll-margin-bottom:96px}
.sheet .draftnote{background:#fff3cd;border-radius:8px;padding:6px 10px;color:#4d3b00}
.sheet .btns button{flex:1;min-height:54px;border-radius:12px;font-size:18px;font-weight:700;border:1px solid var(--line);background:#fff}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:12px 18px;border-radius:12px;font-size:16px;max-width:92vw;z-index:120;opacity:0;pointer-events:none;transition:opacity .2s}

.addr{overflow-wrap:anywhere;font-weight:650}

/* ---------- import and merge (never replaces anything) ---------- */
function normalizeImport(obj){
  if (!obj || typeof obj !== "object" || !Array.isArray(obj.sections)) throw new Error("This doesn't look like a notes file from this app.");
  var seen = {};
  function id(x){ var v = okId(x) && !seen[x] ? x : uid(); seen[v] = 1; return v; }
  return obj.sections.filter(function(s){ return s && typeof s === "object"; }).map(function(s){
    var sec = { id:id(s.id), title:cleanTitle(s.title) || "Untitled section", created:String(s.created||now()).slice(0,40),
      topics:(Array.isArray(s.topics)?s.topics:[]).filter(function(t){ return t && typeof t === "object"; }).map(function(t){
        return { id:id(t.id), title:cleanTitle(t.title) || "Untitled topic", created:String(t.created||now()).slice(0,40),
          subsections:(Array.isArray(t.subsections)?t.subsections:[]).filter(function(u){ return u && typeof u === "object"; }).map(function(u){ return { id:id(u.id), title:cleanTitle(u.title), html:sanitize(typeof u.html === "string" ? u.html : "") }; }) };
      }) };
    if (s.sample === true) sec.sample = true;
    return sec;
  });
}
function baseTitle(t){ return norm(String(t).replace(/\s*\(imported(?: \d+)?\)$/i, "")); }
/* The built-in sample picture is drawn by the phone, so its bytes can differ a little between phones and browsers.
   When comparing notes, every copy of it counts as the same picture. */
function fpHtml(h){ return String(h).replace(/<img src="data:image\/[^"]*" alt="Sample picture">/g, '<img alt="Sample picture">'); }
function fingerprint(t){ return baseTitle(t.title) + "\u0001" + t.subsections.map(function(u){ return norm(u.title) + "\u0002" + fpHtml(u.html); }).join("\u0003"); }
function freshIds(obj, ids){
  function fix(x){ if (ids[x.id]) x.id = uid(); ids[x.id] = 1; }
  fix(obj); (obj.topics||[]).forEach(function(t){ fix(t); t.subsections.forEach(fix); }); (obj.subsections||[]).forEach(fix);
  return obj;
}
function uniqueTitle(list, base){ var t = base, n = 2; while (list.some(function(x){ return norm(x.title) === norm(t); })) { t = base.replace(/\)$/, " " + n + ")"); n++; } return t; }
function sameParts(a, b){ return same(a.subsections.map(function(u){ return [norm(u.title), fpHtml(u.html)]; }), b.subsections.map(function(u){ return [norm(u.title), fpHtml(u.html)]; })); }
function merge(sections){
  var sum = { newSections:[], newTopics:0, already:0, copies:[], changed:[], intoExisting:[] };
  var ids = allIds();
  sections.forEach(function(s){
    var local = findSection(s.id) || data.sections.filter(function(x){ return norm(x.title) === norm(s.title); })[0];
    if (!local){
      var fresh = freshIds(JSON.parse(JSON.stringify(s)), ids); fresh.imported = now();
      data.sections.push(fresh); sum.newSections.push(fresh.title); sum.newTopics += fresh.topics.length; return;
    }
    var added = 0;
    s.topics.forEach(function(t){
      var fp = fingerprint(t), mineT = findTopic(t.id);
      /* Same topic (same id) that only got a new name here, or is identical: nothing to add. */
      if ((mineT && sameParts(mineT.topic, t)) || local.topics.some(function(x){ return fingerprint(x) === fp; })) { sum.already++; return; }
      var copy = freshIds(JSON.parse(JSON.stringify(t)), ids); copy.imported = now();
      var plainT = cleanTitle(t.title.replace(/\s*\(imported(?: \d+)?\)$/i, ""));
      if (mineT){ copy.title = uniqueTitle(local.topics, plainT + " (imported)"); sum.changed.push("“" + mineT.topic.title + "” (the file’s version is “" + copy.title + "”)"); }
      else if (local.topics.some(function(x){ return baseTitle(x.title) === baseTitle(t.title); })){ copy.title = uniqueTitle(local.topics, plainT + " (imported)"); sum.copies.push(copy.title); }
      local.topics.push(copy); sum.newTopics++; added++;
    });
    if (added) sum.intoExisting.push(local.title);
  });
  return sum;
}
function summaryText(sum){
  var lines = [];
  if (sum.newSections.length) lines.push("New sections: " + sum.newSections.join(", ") + ".");
  if (sum.newTopics) lines.push(plural(sum.newTopics, "topic was", "topics were") + " added.");
  if (sum.intoExisting.length) lines.push("Some were put into your existing section" + (sum.intoExisting.length>1?"s":"") + ": " + sum.intoExisting.join(", ") + ".");

    $("#ed").dispatchEvent(new Event("input"));

}
function resizeImage(file, maxEdge, quality){
  return new Promise(function(resolve, reject){
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function(){
      try {
        var w = img.naturalWidth, h = img.naturalHeight, sc = Math.min(1, maxEdge / Math.max(w, h));
        var cw = Math.max(1, Math.round(w * sc)), ch = Math.max(1, Math.round(h * sc));
        var c = document.createElement("canvas"); c.width = cw; c.height = ch;
        var x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, cw, ch); x.imageSmoothingQuality = "high"; x.drawImage(img, 0, 0, cw, ch);
        URL.revokeObjectURL(url); resolve({ src:c.toDataURL("image/jpeg", quality), width:cw, height:ch });
      } catch(e){ URL.revokeObjectURL(url); reject(e); }
    };
    img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error("bad image")); };
    img.src = url;
  });
}
function insertImageFile(file){
  if (!file) return;
  toast("Adding picture…");
  resizeImage(file, 1200, 0.8).then(function(r){
    restoreRange();
    document.execCommand("insertHTML", false, '<figure class="pic size-l"><img src="' + r.src + '" alt=""></figure><p><br></p>');
    lockFigures($("#ed"));
    $("#ed").dispatchEvent(new Event("input")); flushEditor();
    toast("Picture added (" + r.width + "×" + r.height + ", " + fmtSize(r.src.length * 0.75) + "). Tap it to change size or add a caption.");
  }, function(){ info("Couldn't add that picture", "Please try a different photo (JPEG or PNG work best)."); });
}
function lockFigures(box){ if (box) box.querySelectorAll("figure").forEach(function(f){ f.setAttribute("contenteditable", "false"); }); }
function pictureSheet(fig){
  var m = $("#modal"), img = fig.querySelector("img"), capEl = fig.querySelector("figcaption"), armed = false;
  var size = (/size-(s|m|l)/.exec(fig.getAttribute("class") || "") || [0, "l"])[1];
  m.innerHTML = '<div class="sheet"><h2>Picture</h2><img class="pv" alt=""><label class="fl">Size</label><div class="seg" role="group" aria-label="Picture size">' +
    [["s","Small"],["m","Medium"],["l","Full width"]].map(function(o){ return '<button type="button" data-size="'+o[0]+'" aria-pressed="'+(o[0]===size)+'">'+o[1]+'</button>'; }).join("") +
    '</div><label class="fl" for="pcap">Caption (optional)</label><input class="text" id="pcap" autocomplete="off" autocapitalize="sentences" placeholder="Words to show under the picture" value="' + esc(capEl ? capEl.textContent : "") + '">' +
    '<div class="btns"><button type="button" class="warn" id="prm">Remove picture</button><button type="button" class="ok" id="pok">Done</button></div></div>';
  $(".pv", m).src = img.src; m.classList.add("show");
  var sid, closed = false;
  function close(changed){ if (closed) return; closed = true; m.classList.remove("show"); m.innerHTML = ""; document.removeEventListener("keydown", key); if (changed){ var box = $("#ed"); if (box){ box.dispatchEvent(new Event("input")); flushEditor(); } } sheetClosed(sid); }
  function done(){
    fig.setAttribute("class", "pic size-" + size);
    var c = cleanTitle($("#pcap", m).value).slice(0, 300);
    if (c){ if (!capEl){ capEl = document.createElement("figcaption"); fig.appendChild(capEl); } capEl.textContent = c; } else if (capEl) capEl.remove();
    close(true);
  }
  function key(e){ if (e.key === "Escape") close(false); else if (e.key === "Enter" && e.target.id === "pcap"){ e.preventDefault(); done(); } }
  document.addEventListener("keydown", key);
  m.querySelectorAll("[data-size]").forEach(function(b){ b.onclick = function(){ size = b.getAttribute("data-size"); m.querySelectorAll("[data-size]").forEach(function(x){ x.setAttribute("aria-pressed", String(x === b)); }); }; });
  $("#prm", m).onclick = function(){ if (!armed){ armed = true; this.textContent = "Tap again to remove"; return; } fig.remove(); close(true); toast("Picture removed."); };
  $("#pok", m).onclick = done;
  m.onclick = function(e){ if (e.target === m) close(false); };
  sid = sheetOpened(function(){ done(); });  /* Back keeps what was chosen (size, caption), like Done */
}
$("#pickImage").addEventListener("change", function(e){ var f = e.target.files && e.target.files[0]; e.target.value = ""; insertImageFile(f); });

/* ---------- sample content (King James Version) ---------- */
function samplePicture(){

    var c = document.createElement("canvas"); c.width = 800; c.height = 450; var x = c.getContext("2d");
    var g = x.createLinearGradient(0, 0, 0, 450); g.addColorStop(0, "#9cc3e6"); g.addColorStop(1, "#f6e3b4"); x.fillStyle = g; x.fillRect(0, 0, 800, 450);
    x.fillStyle = "#fff7df"; x.beginPath(); x.arc(400, 330, 110, Math.PI, 0); x.fill();
    x.fillStyle = "#5a7d4a"; x.beginPath(); x.moveTo(0, 340); x.quadraticCurveTo(220, 280, 420, 335); x.quadraticCurveTo(620, 390, 800, 320); x.lineTo(800, 450); x.lineTo(0, 450); x.fill();
    x.fillStyle = "#2f3b2a"; x.font = "bold 40px sans-serif"; x.textAlign = "center"; x.fillText("Sample picture", 400, 418);
    return c.toDataURL("image/jpeg", 0.8);

}
/* Samples quote the King James Version word for word (checked against Bible Gateway KJV and bible-api.com KJV). */

        { id:"sample-sub-e2-link", title:"Read the whole chapter", html:'<p>Example of a link: <a href="https://www.kingjamesbibleonline.org/Ephesians-Chapter-2/">Ephesians chapter 2 (KJV) online</a> (needs internet).</p>' }

/* Version 0.1 had two different sample sections. They are removed when unchanged, at start-up and when a file is
   brought in. If they were changed, they lose the Sample label and the user is asked once whether to delete them.
   Only a fingerprint of the old samples is kept here. Pictures, picture frames and captions are ignored by the
   fingerprint, because bringing in an old file puts each picture in a frame. */
var OLD_SAMPLES = { "sample-gods-name":"57c7cce9", "sample-kingdom":"50292131" };
/* Version 0.3 and 0.4 samples (same ids as now). Unchanged ones are updated to the current wording. */
var OLD_V03 = { "sample-deity-of-christ":["3d80b6a0", "5d8df88c"], "sample-salvation-by-grace":["b0534bf3"] };
function hashStr(t){ var h = 2166136261; for (var i = 0; i < t.length; i++){ h ^= t.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h.toString(16); }
function sigHtml(h){ return String(h).replace(/<figcaption[\s\S]*?<\/figcaption>/gi, "").replace(/<\/?figure[^>]*>|<img[^>]*>/gi, ""); }
function sampleSig(s){ return hashStr(JSON.stringify([s.title, s.topics.map(function(t){ return [t.id, t.title, t.subsections.map(function(u){ return [u.id, u.title, sigHtml(u.html)]; })]; })])); }
function tidyOldSamples(list, rep){
  var out = [], fresh = null;
  list.forEach(function(s){
    if (OLD_SAMPLES[s.id]){
      if (sampleSig(s) === OLD_SAMPLES[s.id]){ rep.removed++; return; }
      if (s.sample){ delete s.sample; s.title = cleanTitle(s.title.replace(/\s*\(sample\)\s*$/i, "") + " (old sample, changed)"); rep.kept.push(s.title); }
    } else if (s.sample && OLD_V03[s.id] && OLD_V03[s.id].indexOf(sampleSig(s)) >= 0){
      fresh = fresh || makeSamples(); var nw = fresh.filter(function(x){ return x.id === s.id; })[0];
      if (nw){ out.push(nw); rep.updated++; return; }
    }
    out.push(s);
  });
  return out;
}
function isOldSample(s){ return !!OLD_SAMPLES[s.id]; }

/* ---------- start up ---------- */
function readBundle(){ try { var b = $("#wa-bundle"); var t = b && b.textContent.trim(); return t ? JSON.parse(t) : null; } catch(e){ console.warn("bundle", e); return null; } }
var BUNDLE = readBundle();
var COPY_ID = BUNDLE && okId(BUNDLE.copyId) ? BUNDLE.copyId : "main";
var movedFromShared = false;
/* Tabs and windows of this same copy tell each other when they save, so each shows the latest notes. */
var bc = null; try { if (window.BroadcastChannel) bc = new BroadcastChannel("wa-notes-" + COPY_ID); } catch(e){}
var warnedOther = false;
/* Messages go by BroadcastChannel and also through simple storage (some browsers don't pass the first between saved files). */
function tellOthers(m){ m.from = TAB; try { if (bc) bc.postMessage(m); } catch(e){} try { m.n = uid(); localStorage.setItem("wa-msg-" + COPY_ID, JSON.stringify(m)); } catch(e){} }
function onMessage(m){ if (!m || m.from === TAB) return; if (m.t === "hello"){ tellOthers({t:"here"}); otherWindow(); } else if (m.t === "here") otherWindow(); else if (m.t === "saved") checkForNewer(); }
function otherWindow(){ if (warnedOther) return; warnedOther = true; banner("This app is also open in another tab or window. Changes from both are combined, so nothing is lost, but it’s simplest to use just one."); }
if (bc) bc.onmessage = function(e){ onMessage(e.data); };
window.addEventListener("storage", function(e){
  if (e.key === "wa-" + COPY_ID + "-data") checkForNewer();
  else if (e.key === "wa-msg-" + COPY_ID && e.newValue){ try { onMessage(JSON.parse(e.newValue)); } catch(err){} }
});
store.init(COPY_ID).then(function(){ return Promise.all([store.get("data"), store.get("meta")]); }).then(function(r){
  /* One-time move of notes saved by version 0.1 (shared space) into this copy's own space. Only the main copy does this. */
  if (r[1] || COPY_ID !== "main" || store.mode() === "memory") return r;
  return store.legacyGet("meta").then(function(lm){
    if (lm && lm.migratedTo) return r;
    return store.legacyGet("data").then(function(ld){
      if (!ld || !Array.isArray(ld.sections)) return r;
      var nm = { initialized:true, appliedBundles:(lm && Array.isArray(lm.appliedBundles)) ? lm.appliedBundles : [], movedFromShared:now() };
      return store.set("data", ld).then(function(){ return store.set("meta", nm); }).then(function(){
        var m2 = lm || {}; m2.migratedTo = "main"; m2.migratedAt = now(); return store.legacySet("meta", m2);
      }).then(function(){ movedFromShared = true; return [ld, nm]; });
    });
  }).catch(function(e){ console.warn("could not move older notes", e); return r; });
}).then(function(r){
  if (r[0] && Array.isArray(r[0].sections)){ data = { sections: r[0].sections }; rev = typeof r[0].rev === "number" ? r[0].rev : 0; baseJSON = JSON.stringify({sections:data.sections}); }
  if (r[1]) meta = r[1]; if (!Array.isArray(meta.appliedBundles)) meta.appliedBundles = [];
  loaded = true;
  var bundle = BUNDLE, message = null, oldRep = { removed:0, kept:[], updated:0 };
  data.sections = tidyOldSamples(data.sections, oldRep);
  if (oldRep.removed){ var have = allIds(); var add = makeSamples().filter(function(x){ return !have[x.id]; }); if (add.length) merge(add); }
  if (oldRep.removed || oldRep.kept.length || oldRep.updated) saveSoon(0);
  if (applyPending()) saveSoon(0);
  if (!meta.initialized){
    if (!(bundle && bundle.noSamples) && !data.sections.length) data.sections = makeSamples();
    meta.initialized = true; saveSoon(0); saveMeta();
  }
  if (bundle && bundle.data && bundle.bundleId && meta.appliedBundles.indexOf(bundle.bundleId) < 0){
    try { var brep = { removed:0, kept:[], updated:0 }; var sum = merge(tidyOldSamples(normalizeImport(bundle.data), brep)); sum.oldGone = brep.removed; sum.oldKept = brep.kept; message = summaryText(sum); } catch(e){ console.warn(e); }
    meta.appliedBundles.push(String(bundle.bundleId).slice(0, 64)); saveSoon(0); saveMeta();
  }
  if (navigator.storage && navigator.storage.persist) { try { navigator.storage.persist().catch(function(){}); } catch(e){} }
  navStack = [location.hash || "#/"];
  render();
  if (store.mode() === "memory") info("Notes can't be kept", "This browser won't let the app keep notes on this device. You can still write, but save a file from Share before closing.");
  if (message) info("Notes that came with this app", message);
  else if (oldRep.kept.length && !meta.oldSampleAsked){
    meta.oldSampleAsked = now(); saveMeta();
    modal({ title:"Old sample sections", message:"Your notes still have sample sections from an earlier version of the app, which you had changed: " + oldRep.kept.join(", ") + ".\n\nThey are no longer marked “Sample”. Would you like to delete them now? (Choose Keep if you wrote your own notes in them.)", ok:"Delete them", cancel:"Keep them", danger:true }).then(function(ok){
      if (!ok) return; data.sections = data.sections.filter(function(s){ return !isOldSample(s); }); saveSoon(0); render(); toast("Old sample sections deleted.");
    });
  }

}).catch(function(e){ console.error(e); $("#main") && ($("#main").innerHTML = '<p class="lead">Something went wrong while opening your notes. Please reload the page.</p>'); });
window.__wa = { get data(){ return data; }, copyId: COPY_ID, get movedFromShared(){ return movedFromShared; }, get rev(){ return rev; }, sanitize: sanitize, merge: merge, merge3: merge3, normalizeImport: normalizeImport, saveNow: saveNow, doSearch: doSearch, makeSamples: makeSamples, sampleSig: sampleSig, tidyOldSamples: tidyOldSamples, checkForNewer: checkForNewer, safeHref: safeHref, version: APP_VERSION };
})();
